<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse Dashboard</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#17211c;--mu:#66736b;--pr:#0f6b4f;--ln:#e2e6e1;--ok:#1b8a5a;--bad:#c8472b;--warn:#c98a10;--in:#1b8a5a;--out:#e07a3f}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--tx:#e8efe9;--mu:#93a39a;--pr:#3fbf8f;--ln:#26332c}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--pr);color:#fff}
header h1{font-size:18px;margin:0;flex:1}header small{opacity:.85}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx)}header button{background:rgba(255,255,255,.2)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px}.k b{display:block;font-size:26px}.k span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--pr);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}
.p{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ln)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#login{max-width:340px;margin:12vh auto;text-align:center}#login input{width:100%;margin-bottom:10px}
#msg{color:var(--bad);min-height:20px;font-size:14px}.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="card">
  <h2>Warehouse Dashboard</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go" style="width:100%">Masuk</button>
  <p id="msg"></p>
</div>

<div id="app" class="hide">
<header><h1>Warehouse <small id="who"></small></h1><button id="out">Keluar</button></header>
<main>
  <div class="grid" id="kpi"></div>
  <div class="tabs" id="tabs"></div>

  <section id="t0" class="card"><b>Barang masuk dan keluar, 14 hari terakhir</b><div class="wrap"><svg id="chart" height="190"></svg></div></section>

  <section id="t1" class="card hide">
    <div class="bar"><input id="q" placeholder="Cari nama atau kode" style="flex:1;min-width:160px">
      <button id="xs">Excel</button><button id="ps" class="ghost">PDF</button></div>
    <div class="wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Batch</th><th>Sisa</th><th>Kedaluwarsa</th><th>Status</th></tr></thead><tbody id="stk"></tbody></table></div>
  </section>

  <section id="t2" class="card hide">
    <div class="bar">Dari <input id="d1" type="date"> sampai <input id="d2" type="date">
      <button id="ld">Tampilkan</button><button id="xm">Excel</button><button id="pm" class="ghost">PDF</button><span id="mc" style="color:var(--mu)"></span></div>
    <div class="wrap"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Barang</th><th>Batch</th><th>Jumlah</th><th>Referensi</th><th>Catatan</th></tr></thead><tbody id="mv"></tbody></table></div>
  </section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,collection,query,where,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ISI dari Firebase Console > Project settings > Your apps > Web app (config)
const cfg={apiKey:"AIzaSyAZ7bQV2HblzVuL6FsUT57u3KipQb6XxGM",authDomain:"warehouse-7f2d8.firebaseapp.com",projectId:"warehouse-7f2d8",appId:"1:92141578835:web:5d97e790763981cb1c34a6"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),DAY=864e5,WARN=30;
const nf=n=>Number(n||0).toLocaleString("id-ID");
const dk=t=>{const d=new Date(t);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};
const fd=u=>u>0?new Date(u).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}):"-";
const ft=t=>new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let inv={items:{},stats:{}},moves=[],stkRows=[],unsub=null;

$("go").onclick=async()=>{$("msg").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("msg").textContent="Email atau password salah"}};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
  if(!u)return;
  $("who").textContent=u.email;
  unsub=onSnapshot(doc(db,"warehouse","main","data","inventory"),s=>{
    inv=s.exists()?{items:s.data().items||{},stats:s.data().stats||{}}:{items:{},stats:{}};render();
  },()=>{signOut(auth);$("msg").textContent="Email ini tidak punya akses ke data."});
  const t=Date.now();$("d2").valueAsDate=new Date(t);$("d1").valueAsDate=new Date(t-29*DAY);loadMoves();
});

function status(q,e,min,tot){
  if(q<=0)return["Habis","bad"];
  if(e>0){const d=Math.floor((e-Date.UTC(...(()=>{const n=new Date();return[n.getFullYear(),n.getMonth(),n.getDate()]})()))/DAY);
    if(d<0)return["Kedaluwarsa","bad"];if(d<=WARN)return["Segera ("+d+" hr)","warn"]}
  if(min>0&&tot<=min)return["Menipis","warn"];return["Aman","ok"]}

function render(){
  const items=Object.entries(inv.items).map(([c,v])=>({c,n:v.name||c,u:v.unit||"pcs",min:v.min||0,
    b:Object.entries(v.batches||{}).map(([no,b])=>({no,q:b.q||0,e:b.e||0}))})).sort((a,b)=>a.n.localeCompare(b.n));
  let total=0,low=0,soon=0;stkRows=[];
  for(const i of items){
    const live=i.b.filter(x=>x.q>0).sort((a,b)=>(a.e||9e15)-(b.e||9e15)||a.no.localeCompare(b.no));
    const tot=live.reduce((s,x)=>s+x.q,0);total+=tot;if(i.min>0&&tot<=i.min)low++;
    if(!live.length)stkRows.push([i.c,i.n,"-",0+" "+i.u,"-","Habis","bad"]);
    for(const b of live){const[s,k]=status(b.q,b.e,i.min,tot);if(k==="warn"&&s.startsWith("Segera")||s==="Kedaluwarsa")soon++;
      stkRows.push([i.c,i.n,b.no,nf(b.q)+" "+i.u,fd(b.e),s,k])}}
  const td=inv.stats[dk(Date.now())]||{i:0,o:0};
  $("kpi").innerHTML=[["Total stok",nf(total)],["Jenis barang",nf(items.length)],["Masuk hari ini","+"+nf(td.i)],["Keluar hari ini","-"+nf(td.o)],["Stok menipis",nf(low)],["Hampir/lewat kedaluwarsa",nf(soon)]]
    .map(([l,v])=>`<div class="k"><b>${v}</b><span>${l}</span></div>`).join("");
  drawStock();drawChart();
}
function drawStock(){const q=$("q").value.toLowerCase();
  $("stk").innerHTML=stkRows.filter(r=>!q||r[0].toLowerCase().includes(q)||r[1].toLowerCase().includes(q))
   .map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td><span class="p ${r[6]}">${esc(r[5])}</span></td></tr>`).join("")||`<tr><td colspan="6">Belum ada data</td></tr>`}
$("q").oninput=drawStock;

function drawChart(){
  const days=[...Array(14)].map((_,k)=>{const t=Date.now()-(13-k)*DAY;const s=inv.stats[dk(t)]||{i:0,o:0};return{l:new Date(t).getDate(),i:s.i||0,o:s.o||0}});
  const mx=Math.max(1,...days.map(d=>Math.max(d.i,d.o))),W=Math.max(560,days.length*44),H=150;
  $("chart").setAttribute("width",W);
  $("chart").innerHTML=days.map((d,k)=>{const x=k*44+8,hi=d.i/mx*H,ho=d.o/mx*H;
    return`<rect x="${x}" y="${H-hi+10}" width="15" height="${hi}" rx="3" fill="var(--in)"/><rect x="${x+17}" y="${H-ho+10}" width="15" height="${ho}" rx="3" fill="var(--out)"/><text x="${x+16}" y="178" font-size="11" text-anchor="middle" fill="var(--mu)">${d.l}</text>`}).join("")
   +`<text x="8" y="10" font-size="11" fill="var(--in)">■ Masuk</text><text x="70" y="10" font-size="11" fill="var(--out)">■ Keluar</text>`}

async function loadMoves(){
  const a=new Date($("d1").value+"T00:00:00").getTime(),b=new Date($("d2").value+"T23:59:59").getTime();
  try{const s=await getDocs(query(collection(db,"warehouse","main","moves"),where("ts",">=",a),where("ts","<=",b),orderBy("ts","desc"),limit(2000)));
    moves=s.docs.map(d=>d.data());
    $("mv").innerHTML=moves.map(m=>`<tr><td>${ft(m.ts)}</td><td class="${m.type==="IN"?"ok":"warn"}">${m.type==="IN"?"Masuk":"Keluar"}</td><td>${esc(m.name)} (${esc(m.code)})</td><td>${esc(m.batch)}</td><td>${nf(m.qty)} ${esc(m.unit)}</td><td>${esc(m.ref)}</td><td>${esc(m.note)}</td></tr>`).join("")||`<tr><td colspan="7">Tidak ada transaksi</td></tr>`;
    $("mc").textContent=moves.length+" transaksi"+(moves.length>=2000?" (dibatasi 2.000)":"")}
  catch(e){$("mc").textContent="Gagal memuat transaksi"}}
$("ld").onclick=loadMoves;

const tabs=["Ringkasan","Stok","Transaksi"];
$("tabs").innerHTML=tabs.map((t,i)=>`<button data-i="${i}" class="${i?"":"on"}">${t}</button>`).join("");
$("tabs").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;
  tabs.forEach((_,k)=>{$("t"+k).classList.toggle("hide",k!=i)});[...$("tabs").children].forEach((b,k)=>b.classList.toggle("on",k==i))};

const stockHead=["Kode","Nama","Batch","Sisa","Kedaluwarsa","Status"];
const stockData=()=>stkRows.map(r=>r.slice(0,6));
const moveHead=["Waktu","Jenis","Kode","Barang","Batch","Jumlah","Satuan","Referensi","Catatan"];
const moveData=()=>moves.map(m=>[ft(m.ts),m.type==="IN"?"Masuk":"Keluar",m.code,m.name,m.batch,m.qty,m.unit,m.ref||"",m.note||""]);
const stamp=()=>dk(Date.now());

function xlsx(name,head,rows){const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...rows]),"Data");XLSX.writeFile(wb,name+"-"+stamp()+".xlsx")}
function pdf(name,title,head,rows,land){
  const d=new window.jspdf.jsPDF({orientation:land?"landscape":"portrait"});
  d.setFontSize(14);d.text(title,14,15);d.setFontSize(9);d.text("Dicetak "+ft(Date.now()),14,21);
  d.autoTable({head:[head],body:rows,startY:25,styles:{fontSize:8},headStyles:{fillColor:[15,107,79]}});d.save(name+"-"+stamp()+".pdf")}
$("xs").onclick=()=>xlsx("stok-warehouse",stockHead,stockData());
$("ps").onclick=()=>pdf("stok-warehouse","Laporan Stok Warehouse",stockHead,stockData(),false);
$("xm").onclick=()=>xlsx("transaksi-warehouse",moveHead,moveData());
$("pm").onclick=()=>pdf("transaksi-warehouse","Laporan Transaksi ("+$("d1").value+" s/d "+$("d2").value+")",moveHead,moveData(),true);
</script>
</body>
</html>
